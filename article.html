<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articolo · Il Mio Blog</title>

  <!-- Sostituisci https://www.tuo-dominio.it con il tuo dominio reale prima di pubblicare.
       I meta tag qui sotto sono generici: js/article.js li aggiorna via JavaScript con i
       dati dell'articolo aperto, ma i bot di anteprima di WhatsApp/Facebook/X non eseguono
       JavaScript e vedranno questi valori generici (vedi il README per i dettagli). -->
  <link rel="canonical" href="https://www.tuo-dominio.it/article.html">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Il Mio Blog">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="Articolo · Il Mio Blog">
  <meta property="og:description" content="Guide pratiche e articoli su sviluppo web, design e strumenti digitali.">
  <meta property="og:url" content="https://www.tuo-dominio.it/article.html">
  <meta property="og:image" content="https://placehold.co/1200x630/2f6fed/ffffff?text=Il+Mio+Blog">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Articolo · Il Mio Blog">
  <meta name="twitter:description" content="Guide pratiche e articoli su sviluppo web, design e strumenti digitali.">
  <meta name="twitter:image" content="https://placehold.co/1200x630/2f6fed/ffffff?text=Il+Mio+Blog">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar navbar--logo-left navbar--con-categorie">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__logo">
        <img src="assets/logo.png" alt="Logo del blog">
      </a>

      <nav class="navbar__menu" data-navbar-menu>
        <a href="index.html" class="navbar__link">Home</a>
        <a href="articles.html" class="navbar__link">Articoli</a>
        <a href="contact.html" class="navbar__link">Contatti</a>
        <a href="URL_TIKTOK" class="navbar__link navbar__social-link" target="_blank" rel="noopener">
          <img class="navbar__social-logo" src="assets/Loghi_social/tik-tok.png" alt="TikTok">
        </a>
        <a href="URL_YOUTUBE" class="navbar__link navbar__social-link" target="_blank" rel="noopener">
          <img class="navbar__social-logo" src="assets/Loghi_social/youtube.png" alt="YouTube">
        </a>
        <a href="URL_INSTAGRAM" class="navbar__link navbar__social-link" target="_blank" rel="noopener">
          <img class="navbar__social-logo" src="assets/Loghi_social/instagram.png" alt="Instagram">
        </a>
      </nav>
    </div>

    <nav class="categorie" aria-label="Categorie degli articoli">
      <div class="container categorie__inner">
        <a href="articles.html?category=Trattori" class="categorie__link">Trattori</a>
        <a href="articles.html?category=Attrezzature" class="categorie__link">Attrezzature</a>
        <a href="articles.html?category=Macchine%20da%20raccolta" class="categorie__link">Macchine da raccolta</a>
        <a href="articles.html?category=Agronomia" class="categorie__link">Agronomia</a>
        <a href="articles.html?category=Altro" class="categorie__link">Altro</a>
      </div>
    </nav>
  </header>

  <main data-article-root>

    <div class="container">
      <img class="article-cover" data-article-cover src="" alt="" style="display:none;">

      <header class="article-header">
        <a class="article-header__category" data-article-category href="articles.html">Blog</a>
        <h1 data-article-title>Caricamento…</h1>
        <div class="article-header__meta">          
          <span data-article-date></span>
          <span>&middot;</span>
          <span data-article-reading-time></span>
        </div>
      </header>

      <!-- Banner pubblicitario dentro l'articolo (vedi esempio nel README) -->
      <div class="ad-slot">
        <div class="ad-banner ad-banner--rectangle">
          <span class="ad-banner__label">Spazio pubblicitario 300×250</span>
        </div>
      </div>

      <article class="article-content" data-article-content>
        <p class="text-muted">Caricamento del contenuto…</p>
      </article>

      <div class="share-buttons" data-share-buttons></div>

      <div class="load-more-wrap">
        <a href="articles.html" class="btn btn--outline">&larr; Torna agli articoli</a>
      </div>

      <!-- Banner pubblicitario a fine articolo (vedi esempio nel README) -->
      <div class="ad-slot">
        <div class="ad-banner ad-banner--leaderboard">
          <span class="ad-banner__label">Spazio pubblicitario 728×90</span>
        </div>
      </div>

      <section class="related-articles" data-related-articles style="display:none;">
        <h2>Ti potrebbe interessare anche</h2>
        <div class="articles-grid" data-related-articles-list></div>
      </section>
    </div>

  </main>

  <script src="js/main.js"></script>
  <script src="js/cookie-consent.js"></script>
  <script src="content/articles-data.js"></script>
  <script src="js/article.js"></script>
  <script src="js/ads.js"></script>
</body>
</html>
